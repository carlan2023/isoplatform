name: CI

# Build gate. Runs on every push to main and on every pull request, so a
# broken module layer (missing exports, unresolved imports, type errors) can
# never be merged. The `verify` job is the required gate and needs no secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  build:
    name: Production build
    needs: verify
    runs-on: ubuntu-latest
    # Opt-in: set repository variable ENABLE_BUILD_CHECK=true and configure the
    # secrets below. `next build` prerenders ISR pages, which read from Supabase,
    # so it needs real credentials. Off by default so missing secrets never make
    # CI falsely red — typecheck + lint above remain the always-on gate.
    if: ${{ vars.ENABLE_BUILD_CHECK == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_NOTIFICATIONS_FROM: ${{ secrets.RESEND_NOTIFICATIONS_FROM }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          BRORACKS_PUBLIC_KEY: ${{ secrets.BRORACKS_PUBLIC_KEY }}
          BRORACKS_SECRET_KEY: ${{ secrets.BRORACKS_SECRET_KEY }}
          BRORACKS_WEBHOOK_SECRET: ${{ secrets.BRORACKS_WEBHOOK_SECRET }}
