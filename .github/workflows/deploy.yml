name: Deploy (Vercel)

# Deploys iso-platform to Vercel using the Vercel CLI.
#   - Pull requests  -> Preview deployment
#   - Push to main   -> Production deployment
#
# Build (and therefore TypeScript checking via `next build`) runs inside
# `vercel build`, so a broken build fails the job before anything is deployed.
# App env vars (NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_*,
# BRORACKS_*, etc.) are pulled from the Vercel project by `vercel pull` — they do
# NOT need to live in GitHub.
#
# Required GitHub repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN        - https://vercel.com/account/tokens
#   VERCEL_ORG_ID       - from .vercel/project.json after running `vercel link`
#   VERCEL_PROJECT_ID   - from .vercel/project.json after running `vercel link`

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

permissions:
  contents: read

jobs:
  preview:
    name: Preview deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-preview-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy preview
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  production:
    name: Production deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
