<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" width="640" height="468" role="img" aria-labelledby="t d">
  <title id="t">ISO certification roadmap</title>
  <desc id="d">An ISO certificate of registration beside an audit checklist, with the four steps to certification: gap analysis, documentation, internal audit and certification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="468" fill="url(#bg)"/>
  <g stroke="#0d9488" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 78H640M0 156H640M0 234H640M0 312H640M0 390H640"/>
    <path d="M80 0V468M160 0V468M240 0V468M320 0V468M400 0V468M480 0V468M560 0V468"/>
  </g>

  <!-- Checklist clipboard (behind) -->
  <g transform="translate(398 56) rotate(4)" filter="url(#sh)">
    <rect width="210" height="270" rx="14" fill="#0f172a"/>
    <rect x="12" y="26" width="186" height="232" rx="8" fill="#ffffff"/>
    <rect x="70" y="-10" width="70" height="30" rx="8" fill="#d4a017"/>
    <text x="28" y="60" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Audit checklist</text>
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#334155">
      <g transform="translate(28 84)">
        <rect width="18" height="18" rx="4" fill="#0d9488"/><path d="M4 9l4 4 7-8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="28" y="13">Context &amp; scope</text>
      </g>
      <g transform="translate(28 118)">
        <rect width="18" height="18" rx="4" fill="#0d9488"/><path d="M4 9l4 4 7-8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="28" y="13">Risks &amp; objectives</text>
      </g>
      <g transform="translate(28 152)">
        <rect width="18" height="18" rx="4" fill="#0d9488"/><path d="M4 9l4 4 7-8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="28" y="13">Documented info</text>
      </g>
      <g transform="translate(28 186)">
        <rect width="18" height="18" rx="4" fill="#0d9488"/><path d="M4 9l4 4 7-8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="28" y="13">Internal audit</text>
      </g>
      <g transform="translate(28 220)">
        <rect width="18" height="18" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="28" y="13" fill="#64748b">Management review</text>
      </g>
    </g>
  </g>

  <!-- Certificate (front) -->
  <g transform="translate(36 50) rotate(-3)" filter="url(#sh)">
    <rect width="330" height="236" rx="10" fill="#ffffff"/>
    <rect x="10" y="10" width="310" height="216" rx="6" fill="none" stroke="#0d9488" stroke-width="2"/>
    <rect x="16" y="16" width="298" height="204" rx="4" fill="none" stroke="#d4a017" stroke-width="1"/>
    <text x="165" y="54" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#64748b">CERTIFICATE OF REGISTRATION</text>
    <text x="165" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#0f172a">ISO 9001</text>
    <text x="165" y="120" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0d9488" font-weight="600">Quality Management System</text>
    <rect x="70" y="140" width="190" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="95" y="154" width="140" height="6" rx="3" fill="#e2e8f0"/>
    <path d="M44 196h90" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M52 190c10-12 18 8 28-4s16 6 26-2" stroke="#0f172a" stroke-width="1.6" fill="none"/>
    <!-- Seal -->
    <g transform="translate(252 186)">
      <path d="M-14 12l-8 30 14-8 8 14 6-30z M14 12l8 30-14-8-8 14-6-30z" fill="#b45309"/>
      <circle r="28" fill="#d4a017"/>
      <circle r="21" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M-9 0l6 6 12-13" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Roadmap -->
  <g transform="translate(40 346)" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect width="560" height="92" rx="14" fill="#0f172a"/>
    <path d="M70 38H490" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 38H350" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
    <g font-size="12" fill="#e2e8f0" text-anchor="middle">
      <g transform="translate(70 38)"><circle r="13" fill="#0d9488"/><text y="4" font-size="11" font-weight="700" fill="#fff">1</text><text y="36">Gap analysis</text></g>
      <g transform="translate(210 38)"><circle r="13" fill="#0d9488"/><text y="4" font-size="11" font-weight="700" fill="#fff">2</text><text y="36">Documentation</text></g>
      <g transform="translate(350 38)"><circle r="13" fill="#0d9488"/><text y="4" font-size="11" font-weight="700" fill="#fff">3</text><text y="36">Internal audit</text></g>
      <g transform="translate(490 38)"><circle r="13" fill="#d4a017"/><text y="4" font-size="11" font-weight="700" fill="#0f172a">4</text><text y="36">Certified</text></g>
    </g>
  </g>
</svg>
